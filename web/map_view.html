<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture Map Demo</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --bg: #0b1b22;
      --panel: rgba(11, 27, 34, 0.82);
      --text: #e9f4f8;
      --accent: #67d4ff;
      --warn: #8ef0a7;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, #163746 0%, #081117 65%);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .status {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 1000;
      min-width: 260px;
      padding: 14px 16px;
      border: 1px solid rgba(103, 212, 255, 0.25);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    .status h1 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status p {
      margin: 4px 0;
      font-size: 14px;
    }

    .mode {
      color: var(--warn);
      font-weight: 700;
    }

    .zoom {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="status">
    <h1>Gesture Map Demo</h1>
    <p>Mode: <span id="mode" class="mode">IDLE</span></p>
    <p>Zoom: <span id="zoom" class="zoom">8.0</span></p>
    <p>Center: <span id="center">46.8182, 8.2275</span></p>
  </div>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map", {
      zoomControl: true,
      attributionControl: true,
      worldCopyJump: true
    }).setView([46.8182, 8.2275], 8);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 20,
      attribution: "Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
    }).addTo(map);

    const modeEl = document.getElementById("mode");
    const zoomEl = document.getElementById("zoom");
    const centerEl = document.getElementById("center");

    let lastUpdatedAt = 0;
    let applyingRemoteUpdate = false;

    async function pollState() {
      try {
        const response = await fetch("/state", { cache: "no-store" });
        const state = await response.json();
        if (state.updated_at <= lastUpdatedAt) {
          return;
        }

        lastUpdatedAt = state.updated_at;
        modeEl.textContent = state.active_mode.toUpperCase();
        zoomEl.textContent = Number(state.zoom_level).toFixed(1);
        centerEl.textContent = `${Number(state.center_lat).toFixed(4)}, ${Number(state.center_lng).toFixed(4)}`;

        const currentZoom = map.getZoom();
        const targetZoom = Number(state.zoom_level);
        const currentCenter = map.getCenter();
        const targetCenter = L.latLng(Number(state.center_lat), Number(state.center_lng));

        const centerChanged = currentCenter.distanceTo(targetCenter) > 1;
        const zoomChanged = Math.abs(currentZoom - targetZoom) > 0.05;

        if (centerChanged || zoomChanged) {
          applyingRemoteUpdate = true;
          map.flyTo(targetCenter, targetZoom, {
            animate: true,
            duration: 0.18,
            easeLinearity: 0.25
          });
          setTimeout(() => {
            applyingRemoteUpdate = false;
          }, 180);
        }
      } catch (error) {
        modeEl.textContent = "DISCONNECTED";
      }
    }

    map.on("moveend zoomend", () => {
      if (applyingRemoteUpdate) {
        return;
      }
      const center = map.getCenter();
      zoomEl.textContent = map.getZoom().toFixed(1);
      centerEl.textContent = `${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}`;
    });

    pollState();
    setInterval(pollState, 120);
  </script>
</body>
</html>
