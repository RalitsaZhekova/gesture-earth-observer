<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture Earth Observer</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="css/map_view.css">
</head>
<body>
  <div class="status">
    <div class="eyebrow">Live Gesture Controls</div>
    <h1>Gesture Map</h1>
    <p>Mode: <span id="mode" class="mode">IDLE</span></p>
    <p>Zoom: <span id="zoom" class="zoom">3.2</span></p>
    <p>Center: <span id="center">20.0000, -35.0000</span></p>
  </div>

  <button id="classify-map-button" class="classify-button">
    Classify Map Area
  </button>

  <div class="classification-card" id="classificationCard" aria-live="polite">
    <div class="label">Land Cover</div>
    <div class="classification-status" id="classificationStatus">Ready to classify</div>
    <div class="classification-result" id="classificationResult">No result yet</div>
    <div class="classification-confidence" id="classificationConfidence"></div>
  </div>

  <div class="transition-banner" id="transitionBanner">
    <div class="transition-chip">
      <div class="meta">Satellite Shift</div>
      <div class="title" id="transitionTitle">Atlantic Arc</div>
    </div>
  </div>

  <div class="satellite-card">
    <div class="label">Carousel Focus</div>
    <h2 id="satelliteName">Atlantic Arc</h2>
    <p id="satelliteCaption">A wide atmospheric pass between the Americas, Europe, and Africa.</p>
    <div class="track" id="satelliteTrack"></div>
  </div>

  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/map_view.js"></script>
</body>
</html>
